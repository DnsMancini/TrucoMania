name: Fix Mao de 11 Button State

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: reset mao de 11 button state')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/game.js')
          s = p.read_text()
          old = "function mostrarControlesMaoDe11() {\n  btnTruco.classList.remove('oculto');"
          new = "function mostrarControlesMaoDe11() {\n  btnTruco.disabled = false;\n  btnTruco.classList.remove('oculto');"
          if old not in s:
              raise SystemExit('pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/game.js
          git commit -m "fix: reset mao de 11 button state"
          git rm .github/workflows/fix-mao11-truco-2.yml
          git commit -m "chore: remove temporary fix workflow"
          git push
