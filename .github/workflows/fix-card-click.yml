name: Fix card click handler
on:
  push:
    branches: [feature/social-hub]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-hub
          fetch-depth: 0
      - name: Remove direct card click handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/game.js')
          s = p.read_text(encoding='utf-8')
          old = "carta.addEventListener('click',()=>{if(!isMyTurn||!gameActive||isMaoDe11Decision)return;socket.emit('playCard',faceUp?c:{blindIndex:index});clearTurnTimer();});"
          if old not in s:
              raise SystemExit('Target click handler not found')
          p.write_text(s.replace(old, ''), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/game.js
          git commit -m 'fix: restaurar selecao da carta antes de jogar'
          git rm .github/workflows/fix-card-click.yml
          git commit -m 'chore: remover workflow temporario de correcao'
          git push origin HEAD:feature/social-hub
