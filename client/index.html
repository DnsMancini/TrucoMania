<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco Mania</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="lobby" class="screen">
      <h1>🃏 Truco Mania</h1>
      <div class="menu">
        <input type="text" id="nameInput" placeholder="Seu nome" maxlength="15" />
        <button id="createBtn">Criar Sala</button>
        <div class="join-area">
          <input type="text" id="roomInput" placeholder="Código da sala" maxlength="6" />
          <button id="joinBtn">Entrar</button>
        </div>
      </div>
    </div>

    <div id="game" class="screen hidden">
      <div id="mesaFundo">
        <div class="top-bar">
          <div class="team-score timeA">
            <img src="/img/bandeiraverde.png" class="bandeira" />
            <span>Time A: </span><span id="teamAScore">0</span>
          </div>
          <div class="room-code" id="roomCodeDisplay"></div>
          <div class="team-score timeB">
            <img src="/img/bandeirabranca.png" class="bandeira" />
            <span>Time B: </span><span id="teamBScore">0</span>
          </div>
        </div>

        <div class="vira-area">
          <p>Vira: <span id="viraCard"></span></p>
        </div>

        <div class="table-grid">
          <div class="player-slot" id="slotP0">
            <img class="avatar" src="/img/voce.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
          <div class="player-slot" id="slotP1">
            <img class="avatar" src="/img/bot1.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
          <div class="player-slot" id="slotP2">
            <img class="avatar" src="/img/Avatarparceiro.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
          <div class="player-slot" id="slotP3">
            <img class="avatar" src="/img/bot2.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
        </div>

        <div class="table-area" id="tableArea"></div>

        <div class="my-hand" id="playerHand"></div>

        <div class="actions" id="actionsArea"></div>
        <div class="bet-actions" id="betActions"></div>
        <div id="messageArea"></div>
      </div>
    </div>
  </div>

  <!-- Áudios -->
  <audio id="audioTruco" src="/audio/Truco.mp3"></audio>
  <audio id="audioCarta" src="/audio/jogarcarta.mp3"></audio>
  <audio id="audioDistribuir" src="/audio/Distribuicaocartas.mp3"></audio>
  <audio id="audioNove" src="/audio/Nove.mp3"></audio>
  <audio id="audioSeis" src="/audio/Seis.mp3"></audio>
  <audio id="audioDoze" src="/audio/Doze.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
