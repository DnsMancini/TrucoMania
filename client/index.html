<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Truco Mania</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="icon" href="/img/carta-copag-vermelha.png" />
</head>
<body>
  <div id="app">
    <!-- LOBBY -->
    <div id="lobby" class="lobby">
      <div class="lobby-card">
        <div class="lobby-header">
          <p class="lobby-kicker">Lobby oficial</p>
          <h1 class="lobby-title"><span class="lobby-title-icon">🃏</span> Truco Mania</h1>
          <p class="lobby-subtitle">Monte sua mesa e entre em partidas com clima de cassino competitivo.</p>
        </div>
        <div class="lobby-menu">
          <input type="text" id="nameInput" class="lobby-input" placeholder="Seu nome" maxlength="15" />
          <button id="createBtn" class="lobby-button lobby-button-primary">Criar Sala</button>
          <div class="lobby-join-area">
            <input type="text" id="roomInput" class="lobby-input" placeholder="Código da sala" maxlength="6" />
            <button id="joinBtn" class="lobby-button lobby-button-primary">Entrar</button>
          </div>
        </div>
        <div class="rooms-headline">Mesas ao vivo</div>
        <div id="roomsList" class="rooms-list"></div>
        <div id="lobbyStatus" class="lobby-status"></div>
      </div>
    </div>

    <!-- JOGO -->
    <div id="gameWrapper" class="game-hidden">
      <div class="avisoOrientacao"><div>🔄 Gire o dispositivo para jogar</div></div>
      <div class="mesa"></div>

      <!-- Elementos da mesa (dentro do #game, centralizados na mesa circular) -->
      <div id="game">
        <div id="mesaCartas"></div>
        <div class="botHand" id="hand1"></div>
        <div class="botHand" id="hand2"></div>
        <div class="botHand" id="hand3"></div>
        <div id="vira" class="carta oculto"></div>
      </div>

      <!-- JOGADORES (fora do #game, position: fixed no viewport) -->
      <div class="player" id="p0">
        <div class="avatar"></div>
        <span class="name">Você</span>
      </div>
      <div class="player" id="p1">
        <div class="avatar"></div>
        <span class="name"></span>
      </div>
      <div class="player" id="p2">
        <div class="avatar"></div>
        <span class="name"></span>
      </div>
      <div class="player" id="p3">
        <div class="avatar"></div>
        <span class="name"></span>
      </div>

      <!-- Mão do jogador (fora do #game, colada na borda inferior da tela) -->
      <div id="mao"></div>

      <!-- Informações ao vivo (fora do #game, fixo no viewport) -->
      <div id="infoLive">
        <div id="infoRodada">Rodada 1 de 3</div>
        <div id="trucoStatus">Truco: Nenhum</div>
      </div>

      <!-- Painel de histórico (fora do #game) -->
      <div id="painelHistorico">
        <div id="historicoRodadas">
          <div class="bolinha-rodada bolinha-branca"></div>
          <div class="bolinha-rodada bolinha-branca"></div>
          <div class="bolinha-rodada bolinha-branca"></div>
        </div>
      </div>

      <!-- Cronômetro e contagem (fora do #game) -->
      <div id="cronometro" class="cronometro oculto"><span id="cronometroNum"></span></div>
      <div id="contagemRegressiva" class="contagem-regressiva oculto"><span id="contagemNumero">10</span></div>
      <div id="toast"></div>

      <!-- Tela final (fora do #game) -->
      <div class="telaFinal" id="telaFinal">
        <div class="tela-final-card">
          <div id="textoFinal"></div>
          <div id="resumoFinal"></div>
          <div class="tela-final-acoes">
            <button id="btnVoltarLobby">Voltar ao Lobby</button>
            <button id="btnBuscarNova">Nova Partida</button>
          </div>
        </div>
      </div>

      <!-- Botões fora do #game (não rotacionam) -->
      <button id="btnTruco" class="game-button game-button-truco">TRUCO</button>
      <button id="btnCorrer" class="game-button game-button-correr oculto">CORRER</button>

      <div id="placar">
        <div class="placar-times">
          <div class="placar-time placar-time--nos">
            <span class="placar-time-nome">Nós</span>
            <span class="placar-time-pontos" id="teamAScore">0</span>
          </div>
          <div class="placar-time placar-time--eles">
            <span class="placar-time-nome">Eles</span>
            <span class="placar-time-pontos" id="teamBScore">0</span>
          </div>
        </div>
        <span class="placar-status" id="trucoStatusPlacar">Truco: Nenhum</span>
      </div>
      <div id="ui"></div>
    </div>
  </div>

  <audio id="audioTruco" src="/audio/Truco.mp3"></audio>
  <audio id="audioCarta" src="/audio/jogarcarta.mp3"></audio>
  <audio id="audioDistribuir" src="/audio/Distribuicaocartas.mp3"></audio>
  <audio id="audioNove" src="/audio/Nove.mp3"></audio>
  <audio id="audioSeis" src="/audio/Seis.mp3"></audio>
  <audio id="audioDoze" src="/audio/Doze.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
