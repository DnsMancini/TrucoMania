<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Truco Mania</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/img/carta-copag-vermelha.png" />
</head>
<body>
  <div id="app">
    <!-- LOBBY (mantido igual) -->
    <div id="lobby" class="lobby">
      <div class="lobby-card">
        <h1 style="text-align:center; color:#f1c40f;">🃏 Truco Mania</h1>
        <div class="menu" style="text-align:center; margin-top:20px;">
          <input type="text" id="nameInput" placeholder="Seu nome" maxlength="15" style="padding:10px; font-size:16px; border-radius:8px; border:none;" />
          <button id="createBtn" style="padding:10px 20px; margin:5px; font-size:16px; border-radius:8px; border:none; background:#5cb85c; color:white; cursor:pointer;">Criar Sala</button>
          <div class="join-area" style="margin-top:10px;">
            <input type="text" id="roomInput" placeholder="Código da sala" maxlength="6" style="padding:10px; font-size:16px; border-radius:8px; border:none;" />
            <button id="joinBtn" style="padding:10px 20px; margin:5px; font-size:16px; border-radius:8px; border:none; background:#5cb85c; color:white; cursor:pointer;">Entrar</button>
          </div>
        </div>
        <div id="lobbyStatus" style="text-align:center; margin-top:15px; color:#ccc;"></div>
      </div>
    </div>

    <!-- JOGO -->
    <div id="gameWrapper" class="game-hidden">
      <div class="avisoOrientacao">Gire o dispositivo</div>
      <div class="mesa"></div>

      <div id="game">
        <!-- Cartas na mesa -->
        <div id="mesaCartas"></div>

        <!-- Jogadores (posicionados ao redor) -->
        <div class="player" id="p0">
          <div class="avatar avatar-voce"></div>
          <span class="name">Você</span>
        </div>
        <div class="player" id="p1">
          <div class="avatar avatar-bot1"></div>
          <span class="name"></span>
        </div>
        <div class="player" id="p2">
          <div class="avatar avatar-parceiro"></div>
          <span class="name"></span>
        </div>
        <div class="player" id="p3">
          <div class="avatar avatar-bot2"></div>
          <span class="name"></span>
        </div>

        <!-- Mãos dos oponentes -->
        <div class="botHand" id="hand1"></div>
        <div class="botHand" id="hand2"></div>
        <div class="botHand" id="hand3"></div>

        <!-- Mão do jogador -->
        <div id="mao"></div>

        <!-- Carta Vira (sobre a mesa) -->
        <div id="vira" class="carta virada oculto"></div>

        <!-- Placar -->
        <div id="placar">
          <div class="placar-times">
            <div class="placar-time placar-time--nos">
              <span class="placar-time-nome">Nós</span>
              <span class="placar-time-pontos" id="teamAScore">0</span>
            </div>
            <div class="placar-time placar-time--eles">
              <span class="placar-time-nome">Eles</span>
              <span class="placar-time-pontos" id="teamBScore">0</span>
            </div>
          </div>
          <span class="placar-status" id="trucoStatus">Truco: Nenhum</span>
        </div>

        <!-- Painel de rodada -->
        <div id="painelRodada">
          <div id="infoRodada">Rodada 1 de 3</div>
          <div id="trucoDisplay">TRUCO</div>
        </div>

        <!-- Histórico de rodadas -->
        <div id="painelHistorico">
          <div id="historicoRodadas">
            <div class="bolinha-rodada bolinha-branca"></div>
            <div class="bolinha-rodada bolinha-branca"></div>
            <div class="bolinha-rodada bolinha-branca"></div>
          </div>
        </div>

        <!-- Botões de ação -->
        <button id="btnTruco">TRUCO</button>
        <button id="btnCorrer" class="oculto">CORRER</button>

        <!-- Contador de turno -->
        <div class="contadorTurno oculto" id="contadorTurno">10</div>

        <!-- Mensagem -->
        <div id="mensagem"></div>

        <!-- Tela de fim de jogo -->
        <div class="telaFinal" id="telaFinal">
          <div class="tela-final-card">
            <div id="textoFinal"></div>
            <div id="resumoFinal"></div>
            <div class="tela-final-acoes">
              <button id="btnVoltarLobby">Voltar ao Lobby</button>
              <button id="btnBuscarNova">Nova Partida</button>
            </div>
          </div>
        </div>
      </div>

      <!-- UI overlay -->
      <div id="ui"></div>
    </div>
  </div>

  <!-- Áudios -->
  <audio id="audioTruco" src="/audio/Truco.mp3"></audio>
  <audio id="audioCarta" src="/audio/jogarcarta.mp3"></audio>
  <audio id="audioDistribuir" src="/audio/Distribuicaocartas.mp3"></audio>
  <audio id="audioNove" src="/audio/Nove.mp3"></audio>
  <audio id="audioSeis" src="/audio/Seis.mp3"></audio>
  <audio id="audioDoze" src="/audio/Doze.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
