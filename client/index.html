<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco Mania</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- LOBBY -->
    <div id="lobby" class="screen">
      <h1>🃏 Truco Mania</h1>
      <div class="menu">
        <input type="text" id="nameInput" placeholder="Seu nome" maxlength="15" />
        <button id="createBtn">Criar Sala</button>
        <div class="join-area">
          <input type="text" id="roomInput" placeholder="Código da sala" maxlength="6" />
          <button id="joinBtn">Entrar</button>
        </div>
      </div>
    </div>

    <!-- JOGO -->
    <div id="game" class="screen hidden">
      <div class="game-container">
        
        <!-- Cabeçalho -->
        <div class="header">
          <div class="parceiro-info" id="parceiroNome">Parceiro</div>
          <div class="placar-central">
            <span class="nos">Nós:</span> <span id="teamAScore">0</span>
            <span>x</span>
            <span id="teamBScore">0</span> <span class="eles">Eles</span>
          </div>
          <div class="rodada-info">
            <span id="rodadaAtual">Rodada 1 de 3</span><br>
            <span id="trucoStatus">Truco: Nenhum</span>
          </div>
        </div>

        <!-- Área dos oponentes (superior) -->
        <div class="oponentes-area">
          <div class="oponente-slot" id="slotP1">
            <img class="avatar" src="/img/bot1.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
          <div class="oponente-slot" id="slotP3">
            <img class="avatar" src="/img/bot2.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
        </div>

        <!-- Área central (mesa) -->
        <div class="mesa-central">
          <div class="truco-display" id="trucoDisplay">TRUCO</div>
          <div class="rodadas-indicador" id="rodadasIndicador">
            <span>1ª: -</span> | <span>2ª: -</span> | <span>3ª: -</span>
          </div>
          <div class="historico-area">
            <div class="historico-titulo">HISTÓRICO</div>
            <div class="historico-cartas" id="historicoCartas"></div>
          </div>
        </div>

        <!-- Área do jogador (inferior) -->
        <div class="jogador-area">
          <div class="parceiro-slot-lateral" id="slotP2">
            <img class="avatar" src="/img/Avatarparceiro.png" />
            <span class="name"></span>
            <div class="hand"></div>
          </div>
          <div class="voce-slot" id="slotP0">
            <img class="avatar" src="/img/voce.png" />
            <span class="name">Você</span>
            <div class="hand" id="playerHand"></div>
          </div>
          <div class="acoes">
            <button id="trucoBtn">TRUCO</button>
            <button id="correrBtn" style="display:none;">CORRER</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Áudios -->
  <audio id="audioTruco" src="/audio/Truco.mp3"></audio>
  <audio id="audioCarta" src="/audio/jogarcarta.mp3"></audio>
  <audio id="audioDistribuir" src="/audio/Distribuicaocartas.mp3"></audio>
  <audio id="audioNove" src="/audio/Nove.mp3"></audio>
  <audio id="audioSeis" src="/audio/Seis.mp3"></audio>
  <audio id="audioDoze" src="/audio/Doze.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
